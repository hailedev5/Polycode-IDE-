<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="360">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E131F" />
      <stop offset="100%" stop-color="#080C14" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#3A7BD5" />
    </linearGradient>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <style>
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes pulseGlow {
        0%, 100% { filter: drop-shadow(0 0 4px #00D2FF); }
        50% { filter: drop-shadow(0 0 14px #00D2FF); }
      }
      @keyframes typeLine1 {
        0% { clip-path: inset(0 100% 0 0); }
        25%, 100% { clip-path: inset(0 0 0 0); }
      }
      @keyframes typeLine2 {
        0%, 25% { clip-path: inset(0 100% 0 0); }
        50%, 100% { clip-path: inset(0 0 0 0); }
      }
      @keyframes typeLine3 {
        0%, 50% { clip-path: inset(0 100% 0 0); }
        75%, 100% { clip-path: inset(0 0 0 0); }
      }
      @keyframes outputReveal {
        0%, 75% { opacity: 0; transform: translateY(8px); }
        85%, 100% { opacity: 1; transform: translateY(0); }
      }
      .cursor { animation: blink 0.8s infinite; }
      .glow-badge { animation: pulseGlow 2.5s infinite; }
      .code-line-1 { animation: typeLine1 6s infinite steps(25); }
      .code-line-2 { animation: typeLine2 6s infinite steps(25); }
      .code-line-3 { animation: typeLine3 6s infinite steps(25); }
      .output-box { animation: outputReveal 6s infinite ease-out; }
      .mono-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    </style>
  </defs>

  <!-- Window Container -->
  <rect x="2" y="2" width="796" height="356" rx="14" fill="url(#bgGrad)" stroke="#2E3852" stroke-width="1.5" />

  <!-- Window Header -->
  <rect x="2" y="2" width="796" height="42" rx="14" fill="#161B2E" />
  <rect x="2" y="30" width="796" height="14" fill="#161B2E" />
  <line x1="2" y1="44" x2="798" y2="44" stroke="#2E3852" stroke-width="1" />

  <!-- Mac-style dots -->
  <circle cx="22" cy="22" r="6" fill="#EF4444" />
  <circle cx="40" cy="22" r="6" fill="#F59E0B" />
  <circle cx="58" cy="22" r="6" fill="#10B981" />

  <!-- Title Pill -->
  <rect x="80" y="10" width="230" height="24" rx="12" fill="#1F293D" stroke="#2E3852" stroke-width="1" />
  <text x="96" y="26" fill="#00D2FF" font-size="12" font-weight="bold" class="mono-text">&lt; / &gt; PolyCode IDE</text>
  <text x="210" y="26" fill="#94A3B8" font-size="11" class="mono-text">main.rs</text>

  <!-- Offline Status Badge -->
  <rect x="620" y="10" width="160" height="24" rx="12" fill="#052814" stroke="#10B981" stroke-width="1" class="glow-badge" />
  <circle cx="636" cy="22" r="4" fill="#10B981" />
  <text x="648" y="26" fill="#10B981" font-size="11" font-weight="bold" class="mono-text">100% OFFLINE VM</text>

  <!-- Code Editor Body -->
  <!-- Line Numbers Gutter -->
  <rect x="2" y="44" width="46" height="210" fill="#141928" />
  <line x1="48" y1="44" x2="48" y2="254" stroke="#2E3852" stroke-width="1" />
  <text x="28" y="76" fill="#5E6C84" font-size="12" text-anchor="middle" class="mono-text">1</text>
  <text x="28" y="106" fill="#5E6C84" font-size="12" text-anchor="middle" class="mono-text">2</text>
  <text x="28" y="136" fill="#5E6C84" font-size="12" text-anchor="middle" class="mono-text">3</text>
  <text x="28" y="166" fill="#5E6C84" font-size="12" text-anchor="middle" class="mono-text">4</text>
  <text x="28" y="196" fill="#5E6C84" font-size="12" text-anchor="middle" class="mono-text">5</text>
  <text x="28" y="226" fill="#5E6C84" font-size="12" text-anchor="middle" class="mono-text">6</text>

  <!-- Animated Typing Code Lines -->
  <g class="code-line-1">
    <text x="64" y="76" fill="#FF7B72" font-size="13" class="mono-text">fn</text>
    <text x="86" y="76" fill="#D2A8FF" font-size="13" class="mono-text">fibonacci</text>
    <text x="160" y="76" fill="#F1F5F9" font-size="13" class="mono-text">(n: u64) -&gt; u64 {</text>
  </g>

  <g class="code-line-2">
    <text x="94" y="106" fill="#FF7B72" font-size="13" class="mono-text">match</text>
    <text x="144" y="106" fill="#F1F5F9" font-size="13" class="mono-text">n { 0 =&gt; 0, 1 =&gt; 1, _ =&gt; fibonacci(n - 1) + fibonacci(n - 2) }</text>
  </g>

  <text x="64" y="136" fill="#F1F5F9" font-size="13" class="mono-text">}</text>

  <g class="code-line-3">
    <text x="64" y="166" fill="#FF7B72" font-size="13" class="mono-text">fn</text>
    <text x="86" y="166" fill="#D2A8FF" font-size="13" class="mono-text">main</text>
    <text x="120" y="166" fill="#F1F5F9" font-size="13" class="mono-text">() {</text>
    <text x="94" y="196" fill="#00D2FF" font-size="13" class="mono-text">println!</text>
    <text x="156" y="196" fill="#A5D6FF" font-size="13" class="mono-text">("Fib(10) = {}", fibonacci(10));</text>
    <text x="64" y="226" fill="#F1F5F9" font-size="13" class="mono-text">}</text>
  </g>

  <!-- Blinking Cursor -->
  <rect x="365" y="184" width="8" height="16" fill="#00D2FF" class="cursor" />

  <!-- Terminal Output Panel -->
  <line x1="2" y1="254" x2="798" y2="254" stroke="#2E3852" stroke-width="1" />
  <rect x="2" y="254" width="796" height="102" rx="0" fill="#080C14" />

  <!-- Output Header Bar -->
  <rect x="2" y="254" width="796" height="26" fill="#161B2E" />
  <text x="20" y="271" fill="#00D2FF" font-size="11" font-weight="bold" class="mono-text">▶ TERMINAL OUTPUT (STDOUT)</text>
  <rect x="620" y="258" width="160" height="18" rx="4" fill="#052814" stroke="#10B981" stroke-width="0.8" />
  <text x="632" y="271" fill="#10B981" font-size="10" font-weight="bold" class="mono-text">EXIT 0 • 12ms • 32KB</text>

  <!-- Animated Output Message -->
  <g class="output-box">
    <text x="20" y="304" fill="#10B981" font-size="13" font-weight="bold" class="mono-text">Fib(10) = 55</text>
    <text x="20" y="326" fill="#94A3B8" font-size="12" class="mono-text">[AST Sandbox] Static Check: 0 warnings, 0 errors • Cyclomatic: 2 • Target: Rust 2024</text>
    <text x="20" y="344" fill="#64748B" font-size="11" class="mono-text">🤖 Offline AI Recommendation: Consider iterative or matrix exponentiation for O(n) space optimization.</text>
  </g>
</svg>
